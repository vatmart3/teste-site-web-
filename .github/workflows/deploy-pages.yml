# Déploie REGISTRE sur GitHub Pages.
#
# Deux réglages côté dépôt, une fois pour toutes :
#   1. Settings → Pages → Build and deployment → Source : « GitHub Actions »
#   2. L'environnement `github-pages` n'autorise le déploiement que depuis la
#      branche par défaut. Deux options :
#      — fusionner la branche de travail dans `main` (recommandé), ou
#      — Settings → Environments → github-pages → Deployment branches, et y
#        ajouter la branche de travail.
#
# Sur les autres branches, ce workflow construit le site sans le déployer :
# ça vérifie que la compilation passe, sans faire échouer le run.
#
# Le site est servi sur https://<compte>.github.io/<dépôt>/
name: Déployer sur GitHub Pages

on:
  push:
    branches:
      - main
      - claude/registre-bts-dashboard-rji1oy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Pages sert le site dans un sous-dossier portant le nom du dépôt.
      - name: Construire
        env:
          BASE_PAGES: /${{ github.event.repository.name }}/
        run: npm run build:pages

      # Sans ce fichier, Pages passe le contenu dans Jekyll et ignore _*.
      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # L'environnement github-pages refuse les déploiements venant d'ailleurs
    # que de la branche par défaut : inutile de faire échouer le run.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
