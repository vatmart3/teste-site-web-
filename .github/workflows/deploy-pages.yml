# Déploie REGISTRE sur GitHub Pages à chaque push.
#
# Une seule chose à faire côté dépôt, une fois pour toutes :
#   Settings → Pages → Build and deployment → Source : « GitHub Actions »
#
# Le site sera ensuite servi sur https://<compte>.github.io/<dépôt>/
name: Déployer sur GitHub Pages

on:
  push:
    branches:
      - main
      - claude/registre-bts-dashboard-rji1oy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Pages sert le site dans un sous-dossier portant le nom du dépôt.
      - name: Construire
        env:
          BASE_PAGES: /${{ github.event.repository.name }}/
        run: npm run build:pages

      # Sans ce fichier, Pages passe le contenu dans Jekyll et ignore _*.
      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
